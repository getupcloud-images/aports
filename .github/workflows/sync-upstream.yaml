name: Sync Upstream
on:
  schedule:
    - cron: '0 3 * * *' # Runs daily at 3AM
  workflow_dispatch: # Allows manual triggering

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Sync master branch with upstream
        run: gh repo sync ${{ github.repository }} -b master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync 3.24-stable branch with upstream
        run: gh repo sync ${{ github.repository }} -b 3.24-stable
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
